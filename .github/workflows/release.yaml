name: Release go

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64]
        goos: [linux, windows, darwin]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.4'
      - name: Build
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o dist/${{ matrix.goos }}/
      - name: Compress
        run: |
          cd dist/${{ matrix.goos }}
          zip -q -r "../git-tags-${{ matrix.goos }}-${{ github.ref_name }}.zip" .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: git-tags-${{ matrix.goos }}
          path: dist/git-tags-${{ matrix.goos }}-${{ github.ref_name }}.zip
          if-no-files-found: error

  # 手写 release 步骤（gh CLI，runner 预装）：
  # - 只用官方 actions/*，无第三方 action，也无 node20 弃用警告；
  # - 单 job 创建，杜绝 matrix 并发写同一 tag 导致的 422 already_exists；
  # - 已存在则 gh release upload --clobber 补资产，重跑幂等。
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::release ${TAG} 已存在，更新资产"
            gh release upload "${TAG}" dist/*.zip --clobber
          else
            echo "::notice::创建 release ${TAG}"
            gh release create "${TAG}" dist/*.zip \
              --title "${TAG}" \
              --notes "git-tags ${TAG}" || \
              gh release upload "${TAG}" dist/*.zip --clobber
          fi
