name: Release go

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64]
        goos: [linux, windows, darwin]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.4'
      - name: Build
        run: |
          mkdir -p dist/
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o dist/${{ matrix.goos }}/
      - name: Compress Release
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          directory: "dist/${{ matrix.goos }}"
          filename: 'git-tags-${{ matrix.goos }}-${{ github.ref_name }}.zip'
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: git-tags-${{ matrix.goos }}
          path: dist/${{ matrix.goos }}/git-tags-${{ matrix.goos }}-${{ github.ref_name }}.zip
          if-no-files-found: error

  # release 与 build 分离：matrix 各 job 并行执行时若各自调用 Create Release，
  # 会对同一个 tag 并发创建，先到者成功、后到者报 422 already_exists
  # （此前 v2.2.1 的 release 就因此只挂上了 2 个 zip）。改为 build 只上传产物，
  # release 汇总全部 zip 后仅创建/更新一次；allowUpdates 让重跑同一 tag 时
  # 走更新而非新建，天然幂等。
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create Release
        uses: ncipollo/release-action@v1.18.0
        with:
          artifacts: "./dist/*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
