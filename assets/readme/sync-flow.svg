<svg xmlns="http://www.w3.org/2000/svg"
     width="1380" height="340" viewBox="0 0 1380 340"
     role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">同步流程 —— git tag 驱动所有 provider；锁文件根条目随发布同步</title>
  <desc id="flow-desc">示意图：git tag 是唯一权威源，同步到 tauri、flutter、uv、node、moonbit 与 Lua 插件 provider；锁文件根条目版本随发布同步。</desc>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="1380" height="340" rx="20" fill="#0B0D10"/>

  <!-- eyebrow -->
  <text class="sans" x="120" y="64" font-size="20" fill="#8A919C">单一权威源</text>

  <!-- canonical source node -->
  <rect x="590" y="92" width="200" height="66" rx="12" fill="#0E1512" stroke="#7EE787" stroke-width="1.5"/>
  <text class="mono" x="690" y="120" font-size="20" fill="#8A919C" text-anchor="middle">git tag</text>
  <text class="mono" x="690" y="146" font-size="24" font-weight="700" fill="#7EE787" text-anchor="middle">v1.2.3</text>

  <!-- provider pills -->
  <g>
    <rect x="120"  y="196" width="170" height="52" rx="12" fill="#13161B" stroke="#23262C" stroke-width="1"/>
    <rect x="314" y="196" width="170" height="52" rx="12" fill="#13161B" stroke="#23262C" stroke-width="1"/>
    <rect x="508" y="196" width="170" height="52" rx="12" fill="#13161B" stroke="#23262C" stroke-width="1"/>
    <rect x="702" y="196" width="170" height="52" rx="12" fill="#13161B" stroke="#23262C" stroke-width="1"/>
    <rect x="896" y="196" width="170" height="52" rx="12" fill="#13161B" stroke="#23262C" stroke-width="1"/>
    <rect x="1090" y="196" width="170" height="52" rx="12" fill="#13161B" stroke="#23262C" stroke-width="1"/>

    <text class="mono" x="205" y="228" font-size="21" fill="#E6E9EE" text-anchor="middle">tauri</text>
    <text class="mono" x="399" y="228" font-size="21" fill="#E6E9EE" text-anchor="middle">flutter</text>
    <text class="mono" x="593" y="228" font-size="21" fill="#E6E9EE" text-anchor="middle">uv</text>
    <text class="mono" x="787" y="228" font-size="21" fill="#E6E9EE" text-anchor="middle">node</text>
    <text class="mono" x="981" y="228" font-size="21" fill="#E6E9EE" text-anchor="middle">Lua 插件</text>
    <text class="mono" x="1175" y="228" font-size="21" fill="#E6E9EE" text-anchor="middle">moonbit</text>
  </g>

  <!-- arrows from source to each provider -->
  <g stroke="#3B4048" stroke-width="1.5" fill="#3B4048">
    <line x1="690" y1="158" x2="205" y2="196"/>
    <line x1="690" y1="158" x2="399" y2="196"/>
    <line x1="690" y1="158" x2="593" y2="196"/>
    <line x1="690" y1="158" x2="787" y2="196"/>
    <line x1="690" y1="158" x2="981" y2="196"/>
    <line x1="690" y1="158" x2="1175" y2="196"/>
  </g>

  <!-- lock files: root version synced on release -->
  <text class="sans" x="120" y="290" font-size="18" fill="#8A919C">锁文件 — 根条目版本随发布同步</text>

  <g>
    <rect x="710" y="272" width="150" height="40" rx="20" fill="none" stroke="#8A919C" stroke-width="1" stroke-dasharray="5 4"/>
    <rect x="882" y="272" width="150" height="40" rx="20" fill="none" stroke="#8A919C" stroke-width="1" stroke-dasharray="5 4"/>
    <rect x="1054" y="272" width="150" height="40" rx="20" fill="none" stroke="#8A919C" stroke-width="1" stroke-dasharray="5 4"/>
    <text class="mono" x="785" y="297" font-size="18" fill="#8A919C" text-anchor="middle">Cargo.lock</text>
    <text class="mono" x="957" y="297" font-size="18" fill="#8A919C" text-anchor="middle">pubspec.lock</text>
    <text class="mono" x="1129" y="297" font-size="18" fill="#8A919C" text-anchor="middle">uv.lock</text>
  </g>
</svg>
